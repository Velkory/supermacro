name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SuperMacroV1
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Installer les outils Windows
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y --no-progress
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Créer l'icône depuis le logo
        shell: pwsh
        run: |
          magick assets/DistroStudios.png -background none -define icon:auto-resize=256,128,64,48,32,16 src/SuperMacroV1/app.ico
          if (-not (Test-Path "src/SuperMacroV1/app.ico")) {
            throw "La création de l'icône a échoué."
          }

      - name: Compiler l'application
        shell: pwsh
        run: |
          dotnet restore src/SuperMacroV1/SuperMacroV1.csproj
          dotnet publish src/SuperMacroV1/SuperMacroV1.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist/app `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Construire l'installateur
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer/SuperMacroV1.iss"
          if (-not (Test-Path "installer/output/SuperMacroV1-Setup.exe")) {
            throw "L'installateur n'a pas été généré."
          }

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: SuperMacroV1-Installer
          path: installer/output/SuperMacroV1-Setup.exe
          if-no-files-found: error
          retention-days: 30
